<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration | AUSTRAC Audit Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --text: #ffffff;
            --muted: #888888;
            --hairline: rgba(255,255,255,0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 40px;
            border: 1px solid var(--hairline);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand {
            margin-bottom: 32px;
            text-align: left;
        }

        .brand h1 {
            font-family: 'Fraunces', serif;
            font-size: 28px;
            font-weight: 400;
            letter-spacing: -0.01em;
            margin-bottom: 8px;
        }

        .brand p {
            font-size: 13px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
        }

        .form-group input {
            width: 100%;
            padding: 12px 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--hairline);
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-bottom-color 0.3s;
        }

        .form-group input:focus {
            border-bottom-color: #ffffff;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: #ffffff;
            color: #000000;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: opacity 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .status-msg {
            margin-top: 24px;
            font-size: 13px;
            min-height: 18px;
            text-align: center;
        }

        .error { color: #ff4d4d; }
        .success { color: #ffffff; font-weight: 600; }

        .footer-links {
            margin-top: 32px;
            border-top: 1px solid var(--hairline);
            padding-top: 24px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--muted);
        }

        .footer-links a {
            color: #ffffff;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="brand">
            <h1>New Entity</h1>
            <p>Register for Audit Access</p>
        </div>

        <form id="signupForm">
            <div class="form-group">
                <label>Company Name</label>
                <input type="text" id="company" placeholder="Entity Legal Name" required>
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Primary Compliance Officer" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="email@reporting-entity.com.au" required>
            </div>
            <button type="submit" class="login-btn" id="submitBtn">Register</button>
        </form>

        <div id="statusMsg" class="status-msg"></div>

        <div class="footer-links">
            <span>Already registered?</span>
            <a href="./login.html">Sign In</a>
        </div>
    </div>

    <script>
        const API_URL = 'https://mighty-dragons-serve.loca.lt'; 

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const company = document.getElementById('company').value;
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const submitBtn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMsg');

            statusMsg.className = 'status-msg';
            statusMsg.innerText = 'Creating audit profile...';
            submitBtn.disabled = true;

            try {
                // We'll add a signup endpoint to the standalone server
                const response = await fetch(`${API_URL}/api/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, company })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    statusMsg.className = 'status-msg success';
                    statusMsg.innerText = 'Registration complete. Redirecting...';
                    
                    localStorage.setItem('ghl_token', data.token);
                    localStorage.setItem('ghl_user', JSON.stringify(data.user));

                    setTimeout(() => {
                        window.location.href = './index.html'; 
                    }, 1200);
                } else {
                    statusMsg.className = 'status-msg error';
                    statusMsg.innerText = data.message || 'Registration failed.';
                    submitBtn.disabled = false;
                }
            } catch (err) {
                statusMsg.className = 'status-msg error';
                statusMsg.innerText = 'Network error. Service unreachable.';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
