<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Centinl Audit Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #000000;
            --paper: #ffffff;
            --muted: #666666;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter Tight', sans-serif;
            background-color: #050505;
            color: var(--paper);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: rgba(25, 25, 25, 0.85);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 48px;
            border-radius: 12px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
        }
        .brand { margin-bottom: 40px; text-align: center; }
        .brand img { height: 32px; margin-bottom: 24px; filter: brightness(0) invert(1); }
        .brand h1 { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 400; }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; margin-bottom: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; color: #ccc; }
        .form-group input {
            width: 100%; padding: 16px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px; color: #ffffff; font-size: 15px; outline: none;
        }
        .btn-submit {
            width: 100%; padding: 18px; background: #ffffff; color: #000000;
            border: none; font-size: 13px; font-weight: 600; cursor: pointer;
            text-transform: uppercase; border-radius: 2px;
        }
        .status-msg { margin-top: 24px; font-size: 12px; text-align: center; font-family: 'JetBrains Mono', monospace; }
        .error { color: #ff5555; }
        .success { color: #55ff55; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="brand">
            <img src="https://assets.cdn.filesafe.space/wDk2dm52D9L325zEgO6S/media/69d63d6bebf1a608432cce2d.png" alt="Centinl Logo">
            <h1>Reset Password</h1>
        </div>

        <div id="reset-loading" class="status-msg">Verifying token...</div>

        <form id="resetForm" class="hidden">
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="••••••••" required minlength="8">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="••••••••" required minlength="8">
            </div>
            <button type="submit" class="btn-submit">Update Password</button>
        </form>

        <div id="statusMsg" class="status-msg"></div>
    </div>

    <script>
        let BASE_URL = window.location.hostname.includes('localhost') ? 'http://localhost:5001' : 'https://amlcompliance.com.au/hlgp';
        const token = new URLSearchParams(window.location.search).get('token');
        verifyToken();

        async function verifyToken() {
            if (!token) {
                showError('Invalid or missing reset token.');
                return;
            }
            document.getElementById('reset-loading').classList.add('hidden');
            document.getElementById('resetForm').classList.remove('hidden');
        }

        function showError(msg) {
            const status = document.getElementById('statusMsg');
            status.innerText = msg;
            status.className = 'status-msg error';
            document.getElementById('reset-loading').classList.add('hidden');
        }

        document.getElementById('resetForm').onsubmit = async (e) => {
            e.preventDefault();
            const pass = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const status = document.getElementById('statusMsg');

            if (pass !== confirm) {
                showError('Passwords do not match.');
                return;
            }

            status.innerText = 'Updating password...';
            status.className = 'status-msg';

            try {
                const res = await fetch(`${BASE_URL}/api/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password: pass })
                });
                const data = await res.json();

                if (data.success) {
                    status.innerText = 'Password updated successfully. Redirecting to login...';
                    status.className = 'status-msg success';
                    setTimeout(() => window.location.href = '/audit/login-page', 2000);
                } else {
                    showError(data.message || 'Update failed.');
                }
            } catch (err) {
                showError('Connection error.');
            }
        };

        // Initialization handled synchronously above
    </script>
</body>
</html>
