server {
    listen 80;
    server_name test.truewilly.com; # Update if you are using api.truewilly.com

    # SSL Certificate Paths (Update these after setting up Certbot/Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/test.truewilly.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/test.truewilly.com/privkey.pem;

    # Recommended SSL settings for better security
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers on;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # Logging
    access_log /var/log/nginx/test.truewilly.com.access.log;
    error_log /var/log/nginx/test.truewilly.com.error.log;

    # Increase maximum payload size for API requests (e.g. file uploads or large JSON)
    client_max_body_size 50M;

    location / {
        # Proxy Pass to the backend service (e.g., Node.js API running on port 5001)
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        
        # WebSocket support (often needed for real-time backends)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Preserve client IP details so the backend knows the real user's IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uncomment these lines if your backend requires Nginx to handle CORS headers:
        # add_header 'Access-Control-Allow-Origin' '*' always;
        # add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        # add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    }
}
