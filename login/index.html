<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHL Member Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --accent: #06B6D4;
            --bg: #0F172A;
            --card: #1E293B;
            --text: #F8FAF8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            background: var(--card);
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        p { color: #94A3B8; margin-bottom: 2rem; font-size: 0.9rem; }

        .input-group { margin-bottom: 1.5rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; color: #94A3B8; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        
        input {
            width: 100%;
            padding: 1rem;
            background: #0F172A;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 0.75rem;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.2);
        }

        button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            border-radius: 0.75rem;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:hover { opacity: 0.9; transform: scale(1.02); }
        button:active { transform: scale(0.98); }

        .status { margin-top: 1rem; font-size: 0.9rem; min-height: 1.2rem; }
        .error { color: #F43F5E; }
        .success { color: #10B981; }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome Back</h1>
        <p>Access your portal via your GHL account</p>

        <form id="loginForm">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            <button type="submit" id="loginBtn">
                <span id="btnText">Verify & Enter</span>
                <div id="loader" class="loader"></div>
            </button>
        </form>

        <div id="status" class="status"></div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const btn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const loader = document.getElementById('loader');
        const status = document.getElementById('status');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI State
            status.textContent = '';
            btnText.style.display = 'none';
            loader.style.display = 'block';
            btn.disabled = true;

            const email = document.getElementById('email').value;

            try {
                // Pointing to the standalone backend on port 5001
                const response = await fetch('http://localhost:5001/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (data.success) {
                    status.className = 'status success';
                    status.textContent = 'Login successful! Redirecting...';
                    
                    // Save mock token/user info
                    localStorage.setItem('ghl_token', data.token);
                    localStorage.setItem('ghl_user', JSON.stringify(data.user));

                    // Redirect to your GHL page or Dashboard
                    setTimeout(() => {
                        window.location.href = '/dashboard'; 
                    }, 1500);
                } else {
                    status.className = 'status error';
                    status.textContent = data.message || 'Verification failed';
                }
            } catch (err) {
                status.className = 'status error';
                status.textContent = 'Connection error. Is the backend running?';
            } finally {
                btnText.style.display = 'block';
                loader.style.display = 'none';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
