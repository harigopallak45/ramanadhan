<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity Profile | AUSTRAC Audit Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --surface: rgba(25, 25, 25, 0.85);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #8a8577;
            --accent: #d4b256;
            --success: #10b981;
            --pending: #f59e0b;
            --font-sans: 'Inter Tight', sans-serif;
            --font-serif: 'Fraunces', serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
        }

        nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-section { display: flex; align-items: center; gap: 24px; }
        .logo { height: 28px; filter: brightness(0) invert(1); }
        .tagline {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-left: 24px;
            border-left: 1px solid var(--border);
        }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 40px; }

        .header-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            margin-bottom: 32px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        h1 { font-family: var(--font-serif); font-size: 36px; margin-bottom: 8px; }
        
        .role-pill {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            display: inline-block;
            background: rgba(255,255,255,0.1);
        }
        .role-admin { background: rgba(212, 178, 86, 0.15); color: var(--accent); border: 1px solid rgba(212, 178, 86, 0.3); }
        .role-user { background: rgba(255,255,255,0.05); color: var(--text-dim); border: 1px solid var(--border); }

        .btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 6px;
            font-family: var(--font-sans);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .btn:hover { background: rgba(255,255,255,0.05); }
        .btn-primary { background: var(--text-main); color: var(--bg); border: none; }
        .btn-primary:hover { background: #e0e0e0; }
        .btn-danger { color: #ff5555; border-color: rgba(255,85,85,0.3); }
        .btn-danger:hover { background: rgba(255,85,85,0.1); }

        .compliance-section-box {
            margin-bottom: 40px;
        }

        .section-header {
            font-family: var(--font-serif);
            font-size: 22px;
            color: var(--accent);
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(212, 178, 86, 0.2);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .question-card {
            background: linear-gradient(135deg, rgba(25, 25, 25, 0.65) 0%, rgba(15, 15, 15, 0.8) 100%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-left: 4px solid var(--accent);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
        }

        .question-card:hover {
            border-left-width: 6px;
            border-color: rgba(255, 255, 255, 0.12);
            border-left-color: var(--accent);
            transform: translateX(4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            gap: 16px;
        }

        .question-title-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .question-id-badge {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--accent);
            background: rgba(212, 178, 86, 0.1);
            border: 1px solid rgba(212, 178, 86, 0.3);
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
            width: fit-content;
            letter-spacing: 0.5px;
        }

        .question-title {
            font-family: var(--font-serif);
            font-size: 19px;
            color: var(--text-main);
            font-weight: 500;
            line-height: 1.4;
        }

        .question-answers-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .answer-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 14px 18px;
        }

        .answer-label {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .answer-value {
            font-size: 14.5px;
            color: rgba(255, 255, 255, 0.95);
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .answer-pill {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            font-family: var(--font-mono);
        }
        .pill-yes { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .pill-no { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }

        .question-attachments-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 16px;
        }

        .awaiting-evidence-banner {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text-dim);
            font-size: 13px;
            font-style: italic;
        }

        .awaiting-evidence-banner::before {
            content: '⚠️';
            font-style: normal;
        }

        /* Premium Document Cards (glassmorphic) */
        .vault-card {
            background: linear-gradient(135deg, rgba(35, 35, 35, 0.5) 0%, rgba(20, 20, 20, 0.6) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 16px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
        }

        .vault-card:hover {
            transform: translateY(-3px);
            border-color: rgba(212, 178, 86, 0.4);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(212, 178, 86, 0.1);
        }

        .card-glow {
            position: absolute;
            top: -40px;
            right: -40px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            filter: blur(30px);
            opacity: 0.15;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .vault-card:hover .card-glow {
            opacity: 0.25;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            z-index: 2;
        }

        .file-ext-badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .file-spec-id {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--accent);
            font-weight: 600;
        }

        .card-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 14px;
            z-index: 2;
        }

        .file-icon {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .vault-card:hover .file-icon {
            transform: scale(1.1) rotate(-3deg);
        }

        .file-name {
            font-family: var(--font-sans);
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.4;
            word-break: break-all;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 38px;
            text-align: left;
        }

        .file-type-label {
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 8px;
            font-family: var(--font-sans);
        }

        .file-origin-badge {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 4px 8px;
            border-radius: 6px;
            width: 100%;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-sizing: border-box;
        }
        .file-origin-badge span {
            color: var(--accent);
            font-weight: 500;
        }

        .card-footer {
            display: flex;
            gap: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 10px;
            z-index: 2;
            width: 100%;
        }

        .btn-card-action {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 10.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-card-action:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .action-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }

        /* ===== Centinl UI polish (unified across all pages) ===== */
        :root { --gold: #d4b256; }
        body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
        ::selection { background: rgba(212,178,86,0.32); color: #fff; }
        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-track { background: transparent; }
        *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
        *::-webkit-scrollbar-thumb:hover { background: rgba(212,178,86,0.5); background-clip: content-box; }
        :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

        /* Responsive */
        @media (max-width: 820px) {
            .container { padding: 0 20px; margin: 24px auto; }
            .header-box { flex-direction: column; gap: 20px; }
            .header-box > div[style*="text-align: right"] { text-align: left !important; }
            .action-row { justify-content: flex-start !important; }
            #ai-score-panel table { display: block; overflow-x: auto; white-space: nowrap; }
        }
        @media (max-width: 480px) {
            .action-row .btn { flex: 1 1 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="brand-section">
            <img src="https://assets.cdn.filesafe.space/wDk2dm52D9L325zEgO6S/media/69d63d6bebf1a608432cce2d.png" alt="Centinl" class="logo">
            <div class="tagline">s.161 Independent Review</div>
        </div>
        <div style="display:flex; gap: 16px;">
            <button class="btn" onclick="window.location.href='/audit/admin'">← Back to Roster</button>
        </div>
    </nav>

    <div class="container" id="content-area">
        <div style="text-align:center; padding: 100px; color: var(--text-dim); font-family: var(--font-mono);">
            Decrypting Entity Data...
        </div>
    </div>

    <script>
        const _isLocalHost = /^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])$/.test(window.location.hostname);
        let BASE_URL = _isLocalHost ? 'http://localhost:5001' : 'https://amlcompliance.com.au/hlgp';
        const urlParams = new URLSearchParams(window.location.search);
        const entityId = urlParams.get('id');
        const token = localStorage.getItem('jwt_token');

        if (!token || !entityId) {
            window.location.href = '/audit/login-page';
        }

        const RRS_SPEC = [
          { id:"Q01", section:"A. Governance & Program",    title:"AML/CTF Program, policies, procedures" },
          { id:"Q02", section:"A. Governance & Program",    title:"Fraud / Financial Crime Compliance headcount" },
          { id:"Q03", section:"C. Training",                title:"Training schedule, materials and agenda" },
          { id:"Q04", section:"B. Personnel Due Diligence", title:"National Police Clearance Certificates" },
          { id:"Q05", section:"D. Jurisdiction / Delivery", title:"Delivery channel jurisdictions" },
          { id:"Q06", section:"E. Transaction Monitoring",  title:"Full transaction list — sample month" },
          { id:"Q07", section:"A. Governance & Program",    title:"AUSTRAC Business Profile" },
          { id:"Q08", section:"B. Personnel Due Diligence", title:"AMLCO resume / profile" },
          { id:"Q09", section:"G. Reporting",               title:"Prior year Annual Compliance Report" },
          { id:"Q10", section:"A. Governance & Program",    title:"AUSTRAC registration & renewals" },
          { id:"Q11", section:"A. Governance & Program",    title:"AML Compliance framework org chart" },
          { id:"Q12", section:"H. Outsourcing",             title:"Outsourced compliance functions" },
          { id:"Q13", section:"F. KYC / Identity",          title:"Data service invoice — IDV / Sanctions / PEP" },
          { id:"Q14", section:"I. Information Security",    title:"Cyber attack prevention & data protection" },
          { id:"Q15", section:"E. Transaction Monitoring",  title:"EDD investigations — sample month" },
          { id:"Q16", section:"G. Reporting",               title:"Suspicious Matter Reports — sample month" },
          { id:"Q17", section:"B. Personnel Due Diligence", title:"Employee files & periodic due diligence" },
          { id:"Q18", section:"J. Cash Intensity",          title:"Cash intensity management" },
          { id:"Q19", section:"F. KYC / Identity",          title:"Customer onboarding — sample month" },
          { id:"Q20", section:"H. Outsourcing",             title:"Distribution relationship review cadence" },
          { id:"Q21", section:"K. Privacy",                 title:"Australian Privacy Principles response" },
          { id:"Q22", section:"L. On-site Inspection",      title:"On-site inspection scope" },
          { id:"Q23", section:"M. Internal Testing",        title:"Internal reviews and systemic tests" }
        ];

        function resolveFieldInfo(f) {
            const name = String(f.name || f.id || '').trim();
            const nameLower = name.toLowerCase();
            
            // 1. Try to find a match by explicit Q01-Q23 id prefix
            const qMatch = name.match(/Q(?:uestion)?\s*(\d+)/i);
            let qId = null;
            if (qMatch) {
                const num = parseInt(qMatch[1]);
                if (num >= 1 && num <= 23) {
                    qId = 'Q' + String(num).padStart(2, '0');
                }
            }
            
            // 2. If no prefix match, try semantic matching of the title
            if (!qId) {
                const specMatch = RRS_SPEC.find(s => {
                    const titleLower = s.title.toLowerCase();
                    return nameLower.includes(titleLower) || 
                           titleLower.includes(nameLower) ||
                           titleLower.replace('and', '&').includes(nameLower.replace('and', '&')) ||
                           nameLower.replace('and', '&').includes(titleLower.replace('and', '&'));
                });
                if (specMatch) {
                    qId = specMatch.id;
                }
            }
            
            // 3. Fallback check for known custom fields
            if (!qId) {
                if (nameLower.includes('program') || nameLower.includes('policies')) qId = 'Q01';
                else if (nameLower.includes('fte') || nameLower.includes('headcount')) qId = 'Q02';
                else if (nameLower.includes('training')) qId = 'Q03';
                else if (nameLower.includes('police') || nameLower.includes('clearance') || nameLower.includes('npc')) qId = 'Q04';
                else if (nameLower.includes('jurisdiction') || nameLower.includes('delivery')) qId = 'Q05';
                else if (nameLower.includes('transaction list') || nameLower.includes('sample month')) qId = 'Q06';
                else if (nameLower.includes('business profile')) qId = 'Q07';
                else if (nameLower.includes('amlco') || nameLower.includes('resume')) qId = 'Q08';
                else if (nameLower.includes('annual compliance') || nameLower.includes('acr')) qId = 'Q09';
                else if (nameLower.includes('registration') || nameLower.includes('renewal')) qId = 'Q10';
                else if (nameLower.includes('org chart') || nameLower.includes('framework org')) qId = 'Q11';
                else if (nameLower.includes('outsource')) qId = 'Q12';
                else if (nameLower.includes('invoice') || nameLower.includes('idv') || nameLower.includes('sanctions') || nameLower.includes('pep')) qId = 'Q13';
                else if (nameLower.includes('cyber') || nameLower.includes('security') || nameLower.includes('protection')) qId = 'Q14';
                else if (nameLower.includes('edd')) qId = 'Q15';
                else if (nameLower.includes('smr') || nameLower.includes('suspicious')) qId = 'Q16';
                else if (nameLower.includes('employee') || nameLower.includes('periodic')) qId = 'Q17';
                else if (nameLower.includes('cash')) qId = 'Q18';
                else if (nameLower.includes('onboarding')) qId = 'Q19';
                else if (nameLower.includes('distribution') || nameLower.includes('cadence')) qId = 'Q20';
                else if (nameLower.includes('privacy') || nameLower.includes('app')) qId = 'Q21';
                else if (nameLower.includes('inspection') || nameLower.includes('scope')) qId = 'Q22';
                else if (nameLower.includes('internal review') || nameLower.includes('testing') || nameLower.includes('systemic')) qId = 'Q23';
            }
            
            const spec = RRS_SPEC.find(s => s.id === qId);
            if (spec) {
                return {
                    qId: spec.id,
                    section: spec.section,
                    title: spec.title,
                    cleanName: name.replace(/_|-/g, ' ').replace(/\b\w/g, c => c.toUpperCase())
                };
            }
            
            return {
                qId: 'Q00',
                section: 'General Info',
                title: name.replace(/_|-/g, ' ').replace(/\b\w/g, c => c.toUpperCase()),
                cleanName: name.replace(/_|-/g, ' ').replace(/\b\w/g, c => c.toUpperCase())
            };
        }

        function getFileTypeConfig(url, filename) {
            const actualUrl = (url && typeof url === 'object') ? (url.url || '') : (url || '');
            const lowerUrl = String(actualUrl).toLowerCase();
            const lowerName = String(filename || '').toLowerCase();
            
            let ext = 'file';
            if (lowerUrl.includes('.pdf') || lowerName.includes('.pdf') || lowerUrl.includes('/documents/download/') || lowerUrl.includes('leadconnectorhq.com/documents/')) {
                ext = 'pdf';
            } else if (lowerUrl.includes('.png') || lowerName.includes('.png')) {
                ext = 'png';
            } else if (lowerUrl.includes('.jpg') || lowerUrl.includes('.jpeg') || lowerName.includes('.jpg') || lowerName.includes('.jpeg')) {
                ext = 'jpg';
            } else if (lowerUrl.includes('.gif') || lowerName.includes('.gif')) {
                ext = 'gif';
            } else if (lowerUrl.includes('.webp') || lowerName.includes('.webp')) {
                ext = 'webp';
            } else if (lowerUrl.includes('.csv') || lowerName.includes('.csv')) {
                ext = 'csv';
            } else if (lowerUrl.includes('.xls') || lowerUrl.includes('.xlsx') || lowerName.includes('.xls') || lowerName.includes('.xlsx')) {
                ext = 'xlsx';
            } else if (lowerUrl.includes('.doc') || lowerUrl.includes('.docx') || lowerName.includes('.doc') || lowerName.includes('.docx')) {
                ext = 'docx';
            } else if (lowerUrl.includes('.zip') || lowerUrl.includes('.rar') || lowerName.includes('.zip') || lowerName.includes('.rar')) {
                ext = 'zip';
            } else {
                const parts = lowerName.split('.');
                if (parts.length > 1) {
                    ext = parts[parts.length - 1];
                }
            }
            
            const configs = {
                pdf: {
                    accentColor: '#ef4444',
                    badgeBg: 'rgba(239, 68, 68, 0.15)',
                    badgeColor: '#fca5a5',
                    badgeBorder: 'rgba(239, 68, 68, 0.3)',
                    colorGradient: 'radial-gradient(circle at top right, rgba(239, 68, 68, 0.2), transparent 70%)',
                    fileTypeDescription: 'Portable Document Format',
                    fileIcon: `<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M16 13a2 2 0 0 0-2-2H9v6h2a2 2 0 0 0 2-2v-2z"/><path d="M9 13h3"/></svg>`
                },
                png: {
                    accentColor: '#a855f7',
                    badgeBg: 'rgba(168, 85, 247, 0.15)',
                    badgeColor: '#d8b4fe',
                    badgeBorder: 'rgba(168, 85, 247, 0.3)',
                    colorGradient: 'radial-gradient(circle at top right, rgba(168, 85, 247, 0.2), transparent 70%)',
                    fileTypeDescription: 'PNG Image Asset',
                    fileIcon: `<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`
                },
                jpg: {
                    accentColor: '#6366f1',
                    badgeBg: 'rgba(99, 102, 241, 0.15)',
                    badgeColor: '#c7d2fe',

        async function fetchEntity() {
            try {
                const res = await fetch(`${BASE_URL}/api/admin/users/${entityId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.status === 401 || res.status === 403) {
                    window.location.href = '/audit/login-page';
                    return;
                }
                const data = await res.json();
                if (data.success) renderEntity(data.contact);
            } catch (err) {
                document.getElementById('content-area').innerHTML = `<div style="color:red; text-align:center; padding: 40px;">Connection Error: ${err.message}</div>`;
            }
        }

        function formatBytes(bytes) {
            if (!bytes) return '';
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function groupFieldsAndFiles(fields) {
            const groups = {};
            for (let i = 1; i <= 23; i++) {
                const qId = 'Q' + String(i).padStart(2, '0');
                const spec = RRS_SPEC.find(s => s.id === qId);
                groups[qId] = {
                    id: qId,
                    section: spec.section,
                    title: spec.title,
                    answers: [],
                    files: []
                };
            }
            
            groups['Q00'] = {
                id: 'Q00',
                section: 'General Info',
                title: 'General Profile & Unmapped Custom Fields',
                answers: [],
                files: []
            };
            
            fields.forEach(f => {
                const resolved = resolveFieldInfo(f);
                const qId = resolved.qId;
                
                const isFile = f.dataType === 'FILE_UPLOAD' || 
                               (f.value && typeof f.value === 'object' && f.value.url) ||
                               (f.value && typeof f.value === 'string' && (
                                   f.value.includes('http') && (
                                       f.value.includes('/documents/download/') || 
                                       f.value.includes('.pdf') || 
                                       f.value.includes('.jpg') || 
                                       f.value.includes('.png') ||
                                       f.value.includes('.jpeg') ||
                                       f.value.includes('.webp') ||
                                       f.value.includes('.gif')
                                   )
                               ));
                               
                if (isFile) {
                    groups[qId].files.push(f);
                } else {
                    if (f.value !== null && f.value !== undefined && String(f.value).trim() !== '') {
                        groups[qId].answers.push(f);
                    }
                }
            });
            
            return groups;
        }

                </div>
                <div id="compliance-console">
                    ${sectionsHtml}
                </div>
            `;
            
            // Gather all flat survey answers for CSV export
            const csvData = [];
            for (const qId in groups) {
                groups[qId].answers.forEach(f => {
                    csvData.push(f);
                });

            window.currentContactData = contact;

        function filterConsole(query) {
            query = query.toLowerCase().trim();
            const sections = document.querySelectorAll('.compliance-section-box');
            
            sections.forEach(sec => {
                let visibleQuestionsInSection = 0;
                const cards = sec.querySelectorAll('.question-card');
                
                cards.forEach(card => {
                    const searchContent = card.getAttribute('data-search-content');
                    const qId = card.getAttribute('data-q').toLowerCase();
                    
                    if (searchContent.includes(query) || qId.includes(query)) {
                        card.style.display = 'block';
                        visibleQuestionsInSection++;
                    } else {
                        card.style.display = 'none';
                    }
                });
                
                if (visibleQuestionsInSection > 0) {
                    sec.style.display = 'block';
                } else {
                    sec.style.display = 'none';
                }
            });
        }

        function exportCSV() {
            if (!window.currentSurveyData) return;
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Question/Field,Response\n";
            window.currentSurveyData.forEach(row => {
                let id = String(row.name || row.id).replace(/"/g, '""');
                let val = '';
                if (row.value && typeof row.value === 'object') {
                    val = String(row.value.url || '');
                } else {
                    val = String(row.value || '');
                }
                val = val.replace(/"/g, '""');
                csvContent += `"${id}","${val}"\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `${window.currentContactData.firstName}_survey_data.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- File & Media Visual Viewer Modal Functions ---
        function openFileViewer(event, url, filename) {

            const content = document.getElementById('file-viewer-content');
            const title = document.getElementById('file-viewer-title');
            const openBtn = document.getElementById('file-viewer-open-btn');
            const body = document.getElementById('file-viewer-body');
            
            const actualUrl = (url && typeof url === 'object') ? (url.url || '') : (url || '');
            
            title.textContent = filename;
            openBtn.href = actualUrl;
            body.innerHTML = '<div style="color: var(--text-dim); font-family: var(--font-mono); font-size: 12px; padding: 20px;">Loading media...</div>';
            
            modal.style.display = 'flex';
            // Trigger reflow
            modal.offsetHeight;
            modal.style.opacity = '1';
            content.style.transform = 'scale(1)';
            
            // File Type Identification
            const lowerUrl = String(actualUrl).toLowerCase();
            const isImage = lowerUrl.includes('.jpg') || lowerUrl.includes('.jpeg') || lowerUrl.includes('.png') || lowerUrl.includes('.gif') || lowerUrl.includes('.webp') || lowerUrl.includes('.svg');
            const isPdf = lowerUrl.includes('.pdf') || lowerUrl.includes('/documents/download/') || String(actualUrl).includes('leadconnectorhq.com/documents/');
            
            if (isImage) {
                body.innerHTML = `<img src="${actualUrl}" alt="${filename}" style="max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border-radius: 4px; padding: 20px;">`;
            } else if (isPdf) {
                body.innerHTML = `<iframe src="${actualUrl}" style="width: 100%; height: 100%; border: none; background: white;" title="PDF Document"></iframe>`;
            } else {
                body.innerHTML = `
                    <div style="text-align: center; padding: 40px; max-width: 400px; color: var(--text-main);">
                        <div style="font-size: 48px; margin-bottom: 16px;">📁</div>
                        <h4 style="margin-bottom: 12px; font-family: var(--font-serif); font-size: 18px;">Generic Document File</h4>

                        <a href="${actualUrl}" target="_blank" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none;">

        // =====================================================================
        // AI COMPLIANCE SCORE (rag-audit module)
        // =====================================================================
        let _lastAiResult = null;

        const AI_TONE = {
            pass:     { color: '#10b981', label: '#10b981' },
            watch:    { color: '#f59e0b', label: '#f59e0b' },
            fail:     { color: '#f97316', label: '#f97316' },
            critical: { color: '#ef4444', label: '#ef4444' }
        };

        function aiEsc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        async function runAiScore() {
            const panel = document.getElementById('ai-score-panel');
            const btn = document.getElementById('ai-score-btn');
            if (!panel || !btn) return;
            if (!entityId) { alert('No entity selected.'); return; }
            if (btn.disabled) return; // guard against double-submit

            btn.disabled = true;
            const btnLabel = btn.textContent;
            btn.textContent = '✦ Scoring…';

            panel.style.display = 'block';
            panel.innerHTML = `
                <div style="padding: 40px; text-align: center; color: var(--text-dim);">
                    <div style="font-family: var(--font-mono); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--accent);">Centinl AI Reviewer</div>
                    <div style="margin-top: 14px; font-size: 15px; color: var(--text-main);">Assessing 23 review areas against the Chapter 6 framework…</div>
                    <div style="margin-top: 8px; font-size: 12px;">Adequacy &amp; efficacy scoring · usually 5–15 seconds</div>
                </div>`;

            try {
                const res = await fetch(`${BASE_URL}/api/rag-audit/score/${entityId}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                if (res.status === 401 || res.status === 403) { window.location.href = '/audit/login-page'; return; }
                let data;
                try { data = await res.json(); }
                catch { throw new Error(`Server returned ${res.status} (${res.statusText || 'no JSON'})`); }
                if (!res.ok || !data.success) throw new Error(data.message || `Scoring failed (HTTP ${res.status})`);
                _lastAiResult = data.result;
                renderAiScore(data.result);
            } catch (err) {
                panel.innerHTML = `<div style="padding: 28px; color: #ef4444; font-size: 14px;">AI scoring failed: ${aiEsc(err.message)}</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = btnLabel;
            }
        }

        async function uploadAndAnalyze(fileList) {
            const files = Array.from(fileList || []);
            if (!files.length) return;
            const panel = document.getElementById('ai-score-panel');
            const ubtn = document.getElementById('ai-upload-btn');
            if (!panel) return;
            ubtn.disabled = true;
            const ulabel = ubtn.textContent;
            ubtn.textContent = '⬆ Analyzing…';

            panel.style.display = 'block';
            panel.innerHTML = `
                <div style="padding: 40px; text-align: center; color: var(--text-dim);">
                    <div style="font-family: var(--font-mono); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--accent);">Centinl AI Reviewer</div>
                    <div style="margin-top: 14px; font-size: 15px; color: var(--text-main);">Reading ${files.length} document${files.length === 1 ? '' : 's'} and scoring…</div>
                    <div style="margin-top: 8px; font-size: 12px;">Tip: name files like “Q06-transactions.pdf” so they map to the right area.</div>
                </div>`;

            const fd = new FormData();
            files.forEach(f => fd.append('files', f));
            fd.append('entityLabel', (window._entityName || 'Uploaded evidence'));
            if (entityId) fd.append('contactId', entityId);

            try {
                const res = await fetch(`${BASE_URL}/api/rag-audit/analyze-upload`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }, // no Content-Type: browser sets multipart boundary
                    body: fd
                });
                if (res.status === 401 || res.status === 403) { window.location.href = '/audit/login-page'; return; }
                let data;
                try { data = await res.json(); }
                catch { throw new Error(`Server returned ${res.status} (${res.statusText || 'no JSON'})`); }
                if (!res.ok || !data.success) throw new Error(data.message || `Analysis failed (HTTP ${res.status})`);
                _lastAiResult = data.result;
                renderAiScore(data.result);
            } catch (err) {
                panel.innerHTML = `<div style="padding: 28px; color: #ef4444; font-size: 14px;">Upload analysis failed: ${aiEsc(err.message)}</div>`;
            } finally {
                ubtn.disabled = false;
                ubtn.textContent = ulabel;
            }
        }

        function renderAiScore(r) {
            const panel = document.getElementById('ai-score-panel');
            const tone = AI_TONE[r.tone] || AI_TONE.fail;
            const scoredAt = new Date(r.scoredAt).toLocaleString('en-AU', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

            const rows = (r.areas || []).map(a => {
                const statusColors = { adequate: '#10b981', partial: '#f59e0b', inadequate: '#f97316', missing: '#ef4444', error: '#a855f7' };
                const sc = statusColors[a.status] || 'var(--text-dim)';
                const crit = a.criticalFailure ? `<span style="color:#ef4444; font-family:var(--font-mono); font-size:10px; margin-left:6px;">CRITICAL</span>` : '';
                return `
                    <tr style="border-top: 1px solid var(--border);">
                        <td style="padding: 12px 10px; font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); vertical-align: top;">${aiEsc(a.qId)}</td>
                        <td style="padding: 12px 10px; vertical-align: top;">
                            <div style="font-size: 13px; color: var(--text-main);">${aiEsc(a.title)}${crit}</div>
                            <div style="font-size: 12px; color: var(--text-dim); margin-top: 4px; line-height: 1.5;">${aiEsc(a.finding)}</div>
                            ${a.recommendation ? `<div style="font-size: 12px; color: var(--accent); margin-top: 4px; line-height: 1.5;">→ ${aiEsc(a.recommendation)}</div>` : ''}
                        </td>
                        <td style="padding: 12px 10px; text-align: center; font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); vertical-align: top; white-space: nowrap;">${a.adequacy} / ${a.efficacy}</td>
                        <td style="padding: 12px 10px; text-align: right; font-family: var(--font-mono); font-size: 13px; color: var(--text-main); vertical-align: top; white-space: nowrap;">${a.weightedMark}<span style="color: var(--text-dim);">/${a.maxMark}</span></td>
                        <td style="padding: 12px 10px; text-align: center; vertical-align: top;"><span style="font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; color: ${sc}; border: 1px solid ${sc}; border-radius: 4px; padding: 2px 6px;">${aiEsc(a.status)}</span></td>
                    </tr>`;
            }).join('');

            const risks = (r.topRisks || []).map(x => `<li style="margin-bottom: 6px;">${aiEsc(x)}</li>`).join('');

            const warn = (r.incompleteModelOutput && r.incompleteModelOutput.length)
                ? `<div style="padding: 12px 28px; background: rgba(168,85,247,0.12); border-bottom: 1px solid var(--border); font-size: 12px; color: #c084fc;">⚠ The AI did not return a grade for ${r.incompleteModelOutput.length} area(s) that had evidence (${aiEsc(r.incompleteModelOutput.join(', '))}). This score is provisional — re-run before relying on it.</div>`
                : '';

            const docNote = r.documents
                ? `<span style="color: var(--text-dim);"> · ${r.documents.read} document${r.documents.read === 1 ? '' : 's'} read${r.documents.unreadable ? `, ${r.documents.unreadable} unreadable` : ''}</span>`
                : '';
            const uploadNote = (r.upload && r.upload.unmatched && r.upload.unmatched.length)
                ? `<div style="padding: 10px 28px; background: rgba(245,158,11,0.10); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--pending);">⚠ ${r.upload.unmatched.length} uploaded file(s) didn’t map to a review area: ${aiEsc(r.upload.unmatched.join(', '))}. Rename them like “Q06-…​.pdf” and re-upload.</div>`
                : '';

            panel.innerHTML = `
                ${warn}
                ${uploadNote}
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 24px 28px; border-bottom: 1px solid var(--border); flex-wrap: wrap;">
                    <div style="display: flex; align-items: center; gap: 24px;">
                        <div style="text-align: center;">
                            <div style="font-family: var(--font-serif); font-size: 46px; line-height: 1; color: ${tone.color};">${r.score}<span style="font-size: 18px; color: var(--text-dim);">/100</span></div>
                            <div style="font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 6px;">weighted score</div>
                        </div>
                        <div>
                            <span style="display: inline-block; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: ${tone.label}; border: 1px solid ${tone.label}; border-radius: 6px; padding: 4px 10px;">${aiEsc(r.rating)}</span>
                            <div style="font-size: 12px; color: var(--text-dim); margin-top: 10px;">Raw ${r.rawScore}/100 · deductions −${r.deduction} · ${r.criticalFailures} critical gap${r.criticalFailures === 1 ? '' : 's'}${docNote}</div>
                            <div style="font-size: 11px; color: var(--text-dim); margin-top: 4px; font-family: var(--font-mono);">${aiEsc(r.model)} · ${aiEsc(scoredAt)}</div>
                        </div>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn" style="font-size: 12px; padding: 8px 14px;" onclick="copyAiDraft(this)">Copy draft report</button>
                        <button class="btn" style="font-size: 12px; padding: 8px 14px; border-color: var(--accent); color: var(--accent);" onclick="logAiToGhl(this)">Log to GHL</button>
                    </div>
                </div>

                <div style="padding: 22px 28px; border-bottom: 1px solid var(--border);">
                    <div style="font-family: var(--font-mono); font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;">Executive summary</div>
                    <div style="font-size: 14px; line-height: 1.65; color: var(--text-main);">${aiEsc(r.executiveSummary) || '<span style="color:var(--text-dim);">(none generated)</span>'}</div>
                    ${risks ? `<div style="font-family: var(--font-mono); font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin: 18px 0 8px;">Top risks</div><ul style="font-size: 13px; line-height: 1.5; color: var(--text-main); padding-left: 18px;">${risks}</ul>` : ''}
                </div>

                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr style="text-align: left;">
                                <th style="padding: 12px 10px; font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px;">#</th>
                                <th style="padding: 12px 10px; font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px;">Review area &amp; finding</th>
                                <th style="padding: 12px 10px; font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; text-align: center;">Adq / Eff</th>
                                <th style="padding: 12px 10px; font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; text-align: right;">Mark</th>
                                <th style="padding: 12px 10px; font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; text-align: center;">Status</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
                <div style="padding: 14px 28px; font-size: 11px; color: var(--text-dim); line-height: 1.5; border-top: 1px solid var(--border);">
                    AI-generated against a draft AUSTRAC-aligned Chapter 6 rubric. Adequacy = control documented; Efficacy = evidence it operates. Auditor review required before any finding is issued.
                </div>`;
        }

        function copyAiDraft(btn) {
            if (!_lastAiResult) return;
            navigator.clipboard.writeText(_lastAiResult.draftReport).then(() => {
                const t = btn.textContent; btn.textContent = '✓ Copied';
                setTimeout(() => btn.textContent = t, 2000);
            });
        }

        async function logAiToGhl(btn) {
            if (!_lastAiResult) return;
            const r = _lastAiResult;
            const summary = `Centinl AI Compliance Score: ${r.score}/100 (${r.rating}). `
                + `${r.criticalFailures} critical gap(s). Model: ${r.model}.\n\n${r.draftReport}`;
            const orig = btn.textContent; btn.disabled = true; btn.textContent = 'Logging…';
            try {
                const res = await fetch(`${BASE_URL}/api/rag-audit/note/${entityId}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ body: summary })
                });
                let data = {};
                try { data = await res.json(); } catch {}
                btn.textContent = (res.ok && data.success) ? '✓ Logged to GHL' : 'Failed';
            } catch (err) {
                btn.textContent = 'Failed';
            } finally {
                btn.disabled = false;
                setTimeout(() => btn.textContent = orig, 2500);
            }
        }

        fetchEntity();
    </script>

        <div style="position: relative; width: 90%; max-width: 1000px; height: 85vh; background: #111111; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.8); transform: scale(0.95); transition: transform 0.3s ease;" id="file-viewer-content">
            <!-- Header -->
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(20, 20, 20, 0.8);">
                <div style="display: flex; align-items: center; gap: 12px; overflow: hidden; min-width: 0;">
                    <span style="font-size: 20px; flex-shrink: 0;">📄</span>
                    <span id="file-viewer-title" style="font-family: var(--font-sans); font-size: 15px; font-weight: 500; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Document Viewer</span>
                </div>
                <div style="display: flex; align-items: center; gap: 12px; flex-shrink: 0;">
                    <a id="file-viewer-open-btn" href="#" target="_blank" class="btn" style="padding: 6px 12px; font-size: 11px; font-family: var(--font-mono); border-color: rgba(255,255,255,0.2); display: flex; align-items: center; gap: 6px; text-decoration: none; color: white;">
                        <span>↗</span> Open in New Tab
                    </a>
                    <button class="btn" onclick="closeFileViewer()" style="font-size: 20px; color: #8a8577; transition: color 0.2s; background: none; border: none; cursor: pointer; padding: 4px 8px; line-height: 1;">&times;</button>
                </div>
            </div>
            <!-- Body -->
            <div id="file-viewer-body" style="flex: 1; display: flex; align-items: center; justify-content: center; background: #080808; overflow: auto; position: relative;">
                <!-- Content will be injected dynamically -->
            </div>
        </div>
    </div>
</body>
</html>
